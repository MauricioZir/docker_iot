{% extends "layout.html" %}
{% block body %}

<div class="row pt-4">
  <div class="col-md-7 mx-auto">
    <div class="card card-body">
      <form method="POST">
        <legend>Publicar comando al nodo</legend>

        <div class="form-group">
          <label for="nodo">Seleccionar Nodo</label>
          <select class="form-control" id="nodo" name="nodo" required>
            {% for nodo in nodos %}
              <option value="{{ nodo[0] }}" {% if selected_id == nodo[0] %}selected{% endif %}>{{ nodo[1] }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group mt-4">
          <label for="topic_base">Tópico MQTT</label>
          <input type="text" class="form-control" id="topic" name="topic_base" placeholder="Ej: topico1/topico2">
            <small class="form-text text-muted">
              En caso de no ingresar ningún tópico, se usará por defecto el tópico <code>Default</code>.
            </small>
        </div>

        <label class="form-label mt-4">Comandos</label>
        <div class="d-flex justify-content-start mt-4">
          <button type="submit" name="accion" value="destello" class="btn btn-warning me-3">Destello</button>
          <div class="input-group" style="width: 200px;">
            <input type="number" name="setpoint" class="form-control" placeholder="Setpoint">
            <button type="submit" name="accion" value="setpoint" class="btn btn-primary">Setpoint</button>
          </div>
        </div>
      </form>

      <a href="{{ url_for('index') }}" class="btn btn-secondary mt-4">Volver al inicio</a>
    </div>
  </div>
</div>

{% endblock %}
